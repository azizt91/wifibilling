<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metode Pembayaran - WiFi Billing System</title>
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#f9f8fb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="WiFi Billing System">

    <!-- PWA Icons -->
    <link rel="icon" type="image/png" sizes="512x512" href="assets/logo_512x512.png">
    <link rel="apple-touch-icon" sizes="192x192" href="assets/logo_192x192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link rel="stylesheet" as="style" onload="this.rel='stylesheet'" href="https://fonts.googleapis.com/css2?display=swap&family=Manrope%3Awght%40400%3B500%3B700%3B800&family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Mobile-First Layout Helper -->
    <style id="mobile-first-styles">
        html {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%) !important;
            background-attachment: fixed !important;
        }
        body {
            max-width: 480px !important;
            margin: 0 auto !important;
            min-height: 100vh !important;
            position: relative !important;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.3) !important;
            background-color: #ffffff;
        }
        /* Override fixed positioning for mobile wrapper */
        .fixed {
            position: fixed !important;
            max-width: 480px !important;
            left: 50% !important;
            right: auto !important;
            transform: translateX(-50%) !important;
            width: 100% !important;
        }
        /* Ensure overlay modals and loading elements still cover the whole mobile area */
        .fixed.inset-0 {
            left: 50% !important;
            transform: translateX(-50%) !important;
            width: 100% !important;
            max-width: 480px !important;
        }
    </style>

</head>
<body>
    <!-- Header List View (Sticky) -->
    <header id="payment-methods-header" class="flex items-center bg-white p-4 justify-between border-b border-gray-200 shadow-sm sticky top-0 z-50">
        <button id="payment-methods-back-btn" class="text-[#110e1b] flex size-10 shrink-0 items-center justify-center cursor-pointer hover:bg-gray-100 rounded-full transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
        </button>
        <h2 class="text-[#110e1b] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Metode Pembayaran</h2>
        <div class="w-10"></div>
    </header>

    <!-- Header Form View (Sticky) -->
    <header id="payment-form-header" class="hidden flex items-center bg-white p-4 justify-between border-b border-gray-200 shadow-sm sticky top-0 z-50">
        <button id="payment-form-back-btn" class="text-[#110e1b] flex size-10 shrink-0 items-center justify-center cursor-pointer hover:bg-gray-100 rounded-full transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
        </button>
        <h2 id="payment-form-title" class="text-[#110e1b] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">Tambah Bank Baru</h2>
        <div class="w-10"></div>
    </header>

    <div class="relative flex h-auto min-h-screen w-full flex-col bg-[#f9f8fb] justify-between group/design-root overflow-x-hidden" style='font-family: Manrope, "Noto Sans", sans-serif;'>
        
        <!-- Payment Methods List View -->
        <div id="payment-methods-view">
            <main class="flex-1 pb-6">
                <div class="p-4 space-y-4">
                    <!-- Section: QRIS Payment -->
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                        <div class="flex items-center justify-between mb-2">
                            <h3 class="text-[#110e1b] font-semibold flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="currentColor"
                                    viewBox="0 0 256 256">
                                    <path
                                        d="M104,40H56A16,16,0,0,0,40,56v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V56A16,16,0,0,0,104,40Zm0,64H56V56h48v48Zm0,32H56a16,16,0,0,0-16,16v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V152A16,16,0,0,0,104,136Zm0,64H56V152h48v48ZM200,40H152a16,16,0,0,0-16,16v48a16,16,0,0,0,16,16h48a16,16,0,0,0,16-16V56A16,16,0,0,0,200,40Zm0,64H152V56h48v48Zm-64,72V152a16,16,0,0,1,16-16h8a8,8,0,0,1,0,16h-8v24h24V160a8,8,0,0,1,16,0v16h8a8,8,0,0,1,0,16h-8v8a8,8,0,0,1-16,0v-8H160v8a8,8,0,0,1-16,0v-8h-8A8,8,0,0,1,136,176Z">
                                    </path>
                                </svg>
                                Pembayaran QRIS
                            </h3>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input id="show-qris-input" type="checkbox" class="sr-only peer" checked>
                                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#683fe4]"></div>
                            </label>
                        </div>
                        <p class="text-xs text-gray-500 mb-3">Tampilkan kode QRIS kepada pelanggan saat checkout pembayaran.</p>

                        <div class="border-2 border-dashed border-gray-300 rounded-lg p-4 hover:border-[#683fe4] transition-colors bg-[#f9f8fb]">
                            <label for="qris-upload" class="cursor-pointer block">
                                <div class="flex flex-col items-center gap-2">
                                    <img id="qris-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300' viewBox='0 0 300 300'><rect width='300' height='300' fill='%23f8f9fa' rx='16'/><rect x='20' y='20' width='260' height='260' fill='none' stroke='%23cbd5e1' stroke-width='4' stroke-dasharray='8 8' rx='12'/><path d='M70 70h50v50H70zm20 20h10v10H90zm90-20h50v50h-50zm20 20h10v10h-10zm-110 90h50v50H70zm20 20h10v10H90zm70-40h20v20h-20zm30 0h20v20h-20zm-30 30h20v20h-20zm30 30h20v20h-20zm-30 0h20v20h-20z' fill='%2364748b'/><text x='50%' y='62%' text-anchor='middle' fill='%23475569' font-size='14' font-weight='bold' font-family='sans-serif'>BELUM ADA QRIS</text><text x='50%' y='70%' text-anchor='middle' fill='%2394a3b8' font-size='11' font-family='sans-serif'>Klik untuk upload QRIS</text></svg>" alt="QRIS Preview"
                                        class="w-36 h-36 object-contain rounded-lg border border-gray-200 bg-white shadow-sm p-1">
                                    <div class="text-center">
                                        <span class="inline-flex items-center gap-1.5 text-sm font-semibold text-[#683fe4] hover:underline">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 256 256"><path d="M216,40H40A16,16,0,0,0,24,56V200a16,16,0,0,0,16,16H216a16,16,0,0,0,16-16V56A16,16,0,0,0,216,40Zm0,160H40V56H216V200ZM176,88a12,12,0,1,1-12-12A12,12,0,0,1,176,88ZM64,168a8,8,0,0,1,8-8h112a8,8,0,0,1,6.4,12.8l-24,32a8,8,0,0,1-12.8,0L136,178.67l-17.6,23.47A8,8,0,0,1,112,208H72A8,8,0,0,1,64,168Z"></path></svg>
                                            Ganti Gambar QRIS
                                        </span>
                                        <p class="text-xs text-gray-400 mt-0.5">Format JPG/PNG, maks 2MB</p>
                                    </div>
                                </div>
                                <input id="qris-upload" type="file" class="hidden" accept="image/png,image/jpeg,image/jpg" />
                            </label>
                        </div>
                    </div>

                    <!-- Header for Bank Accounts -->
                    <div class="flex items-center justify-between pt-2">
                        <h4 class="text-sm font-bold text-[#110e1b]">Transfer Bank & E-Wallet</h4>
                    </div>

                    <!-- Add New Button -->
                    <button id="add-payment-btn" class="w-full flex items-center justify-center gap-2 rounded-lg h-12 px-5 bg-[#683fe4] text-white text-base font-bold hover:bg-[#501ee6] transition-colors shadow-md">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" fill="currentColor" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"></path></svg>
                        <span>Tambah Bank Baru</span>
                    </button>

                    <!-- Payment Methods List -->
                    <div id="payment-methods-list" class="space-y-3">
                        <!-- Will be populated dynamically -->
                    </div>

                    <!-- Empty State -->
                    <div id="empty-state" class="hidden text-center py-12">
                        <svg class="mx-auto h-12 w-12 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                        </svg>
                        <h3 class="mt-2 text-sm font-medium text-gray-900">Belum ada metode pembayaran</h3>
                        <p class="mt-1 text-sm text-gray-500">Mulai dengan menambahkan bank atau e-wallet</p>
                    </div>
                </div>
            </main>
        </div>

        <!-- Payment Method Form View (Add/Edit) -->
        <div id="payment-method-form-view" class="hidden">
            <main class="flex-1 pb-6">
                <div class="p-4 space-y-4">
                    <!-- Form -->
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3">
                        <label class="flex flex-col">
                            <p class="text-[#110e1b] text-sm font-medium pb-1">Nama Bank/E-Wallet *</p>
                            <input id="pm-bank-name" type="text" class="form-input w-full rounded-lg text-[#110e1b] border border-[#d6d0e7] bg-white h-10 p-2 text-sm" placeholder="BCA, BNI, DANA, GoPay, dll" required />
                        </label>

                        <label class="flex flex-col">
                            <p class="text-[#110e1b] text-sm font-medium pb-1">Nomor Rekening *</p>
                            <input id="pm-account-number" type="text" class="form-input w-full rounded-lg text-[#110e1b] border border-[#d6d0e7] bg-white h-10 p-2 text-sm" placeholder="1234567890" required />
                        </label>

                        <label class="flex flex-col">
                            <p class="text-[#110e1b] text-sm font-medium pb-1">Nama Pemilik *</p>
                            <input id="pm-account-holder" type="text" class="form-input w-full rounded-lg text-[#110e1b] border border-[#d6d0e7] bg-white h-10 p-2 text-sm" placeholder="Nama Pemilik Rekening" required />
                        </label>

                        <label class="flex flex-col">
                            <p class="text-[#110e1b] text-sm font-medium pb-1">Urutan Tampilan</p>
                            <input id="pm-sort-order" type="number" class="form-input w-full rounded-lg text-[#110e1b] border border-[#d6d0e7] bg-white h-10 p-2 text-sm" placeholder="1" min="1" />
                            <small class="text-xs text-gray-400 mt-1">Urutan tampilan di halaman customer (1 = paling atas)</small>
                        </label>

                        <label class="flex items-center gap-2">
                            <input id="pm-is-active" type="checkbox" class="w-4 h-4 text-[#683fe4] border-gray-300 rounded focus:ring-[#683fe4]" checked />
                            <span class="text-sm text-gray-700">Aktif (tampilkan di halaman customer)</span>
                        </label>
                    </div>

                    <!-- Hidden field for edit mode -->
                    <input id="pm-id" type="hidden" />

                    <!-- Buttons -->
                    <div class="grid grid-cols-2 gap-3">
                        <button id="pm-cancel-btn" class="w-full rounded-lg h-12 px-5 bg-[#eae8f3] text-[#110e1b] text-base font-bold hover:bg-[#d6d0e7] transition-colors">BATAL</button>
                        <button id="pm-save-btn" class="w-full rounded-lg h-12 px-5 bg-[#501ee6] text-[#f9f8fc] text-base font-bold hover:bg-[#3d14b8] transition-colors">SIMPAN</button>
                    </div>

                    <!-- Delete Button (only shown in edit mode) -->
                    <button id="pm-delete-btn" class="w-full rounded-lg h-12 px-5 bg-red-500 text-white text-base font-bold hover:bg-red-600 transition-colors hidden">
                        HAPUS BANK
                    </button>
                </div>
            </main>
        </div>

        <!-- Toast Notification -->
        <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-lg shadow-lg opacity-0 invisible transition-all duration-300 z-50">
            <p id="toast-message" class="text-sm font-medium"></p>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="supabase-client.js"></script>
    <script type="module" src="apply-settings.js"></script>
    <script type="module" src="auth.js"></script>
    <script type="module" src="payment-methods.js?v=2"></script>
</body>
</html>
